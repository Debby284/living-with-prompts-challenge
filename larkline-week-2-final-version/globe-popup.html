<title>Larkline globe popup (standalone)</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<!--
  Larkline Estates prototype: the globe popup on its own.
  Built with three.js r128 (loaded from cdnjs below). Everything else is in this one file.
  - larklineGlobe(stage, MODE): MODE 'area' = popup (earth > Europe > Amsterdam > flight to Horst > villages lit, hover shows the agent).
    MODE 'office' = the "Visit us" version on the real page (starts above Horst, flies to the office).
  - The earth's land comes from a small built-in bitmap (MASK, base64, 1.5 degree cells, 240 x 120).
  - Village positions are approximate. The globe is an illustration, not a map.
  - Colours and sizes are CSS custom properties in :root (LWPR framework style). Change them there.
-->

  --dark-triangles-size: 160px 277.13px;

  --meadow-height: clamp(5rem, 9vw, 9rem);

/* ==========================================================================
   Base tags
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }

html { scroll-behavior: smooth; scroll-padding-top: var(--header-height); }

body {
  margin: 0;
  font-family: var(--body-font);
  font-size: var(--body-size-m);
  font-weight: var(--body-weight);
  line-height: 160%;
  color: var(--primary-dark-2);
  background: var(--primary-light-1);
  -webkit-font-smoothing: antialiased;
  overflow-x: clip;
}

h1, h2, h3, h4, h5, h6 {
  margin: 0;
  font-family: var(--heading-font);
  font-weight: var(--heading-weight);
  text-wrap: balance;
}
h1 { font-size: var(--title-size-1); line-height: 110%; }
h2 { font-size: var(--title-size-2); line-height: 115%; }
h3 { font-size: var(--title-size-3); line-height: 120%; }
h4 { font-size: var(--title-size-4); line-height: 125%; }
h5 { font-size: var(--title-size-5); line-height: 130%; }
h6 { font-size: var(--title-size-6); line-height: 130%; }

p, ul, ol, figure, blockquote, dl, dd { margin: 0; }
p { text-wrap: pretty; }
ul, ol { padding: 0; }
img { display: block; max-width: 100%; }
[hidden] { display: none !important; }
a { color: inherit; }
button, input, select, textarea { font: inherit; }

:focus-visible {
  outline-width: var(--line-thick);
  outline-style: solid;
  outline-color: var(--primary-brand-1);
  outline-offset: var(--focus-ring);
}

/* ==========================================================================
   Framework: typography size
   ========================================================================== */

.title-1 { font-size: var(--title-size-1); font-weight: var(--heading-weight); line-height: 110%; }
.title-2 { font-size: var(--title-size-2); font-weight: var(--heading-weight); line-height: 115%; }
.title-3 { font-size: var(--title-size-3); font-weight: var(--heading-weight); line-height: 120%; }
.title-4 { font-size: var(--title-size-4); font-weight: var(--heading-weight); line-height: 125%; }
.title-5 { font-size: var(--title-size-5); font-weight: var(--heading-weight); line-height: 130%; }
.title-6 { font-size: var(--title-size-6); font-weight: var(--heading-weight); line-height: 130%; }
.body-l { font-size: var(--body-size-l); font-weight: var(--body-weight); line-height: 160%; }
.body-m { font-size: var(--body-size-m); font-weight: var(--body-weight); line-height: 160%; }
.body-s { font-size: var(--body-size-s); font-weight: var(--body-weight); line-height: 160%; }

.sub-title {
  font-family: var(--body-font);
  font-size: var(--title-subtitle);
  font-weight: 700;
  line-height: 140%;
  text-transform: uppercase;
  letter-spacing: 0.12em;
}

.text-link { font-weight: var(--strong-weight); text-decoration: underline; text-underline-offset: 0.2em; }

.use-heading-font { font-family: var(--heading-font); }
.use-body-font { font-family: var(--body-font); }

/* ==========================================================================
   Framework: color roles
   ========================================================================== */

.heading-on-light { color: var(--primary-dark-1); }
.heading-on-dark { color: var(--primary-light-1); }
.body-on-light { color: var(--primary-dark-2); }
.body-on-dark { color: var(--primary-light-2); }
.detail-on-light { color: var(--primary-dark-3); }
.detail-on-dark { color: var(--primary-light-3); }
.subtitle-on-light { color: var(--primary-brand-2); }
.subtitle-on-dark { color: var(--primary-brand-1); }
.link-on-light { color: var(--primary-brand-2); transition: color var(--duration-s) ease; }
.link-on-light:hover { color: var(--primary-dark-1); }
.link-on-dark { color: var(--primary-brand-1); transition: color var(--duration-s) ease; }
.link-on-dark:hover { color: var(--primary-light-1); }

/* ==========================================================================
   Framework: backgrounds
   ========================================================================== */

.bg-light-1 { background-color: var(--primary-light-1); }
.bg-light-2 { background-color: var(--primary-light-2); }
.bg-light-3 { background-color: var(--primary-light-3); }
.bg-dark-1 { background-color: var(--primary-dark-1); }
.bg-dark-2 { background-color: var(--primary-dark-2); }
.bg-dark-3 { background-color: var(--primary-dark-3); }
.bg-brand-1 { background-color: var(--primary-brand-1); }
.bg-brand-2 { background-color: var(--primary-brand-2); }

/* ==========================================================================
   Framework: buttons
   Project choice: the solid button uses brand-2 (the deeper orange), because
   white text on the logo orange (brand-1) only reaches 2.95:1 contrast.
   ========================================================================== */

.btn-solid, .btn-outline, .btn-solid-on-dark, .btn-outline-on-dark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--size-8);
  padding: var(--size-16) var(--size-24);
  font-family: var(--body-font);
  font-size: var(--body-size-m);
  font-weight: var(--strong-weight);
  line-height: 1;
  text-decoration: none;
  border-width: var(--border-width);
  border-style: solid;
  border-radius: var(--button-radius);
  cursor: pointer;
  transition: background-color var(--duration-s) ease, border-color var(--duration-s) ease, color var(--duration-s) ease, transform var(--duration-s) ease;
}
.btn-solid:active, .btn-outline:active, .btn-solid-on-dark:active, .btn-outline-on-dark:active { transform: translateY(1px); }

.btn-solid { color: var(--primary-light-1); background-color: var(--primary-brand-2); border-color: var(--primary-brand-2); }
.btn-solid:hover { background-color: var(--primary-dark-1); border-color: var(--primary-dark-1); }

.btn-outline { color: var(--primary-brand-2); background-color: transparent; border-color: var(--primary-brand-2); }
.btn-outline:hover { color: var(--primary-light-1); background-color: var(--primary-brand-2); }

.btn-solid-on-dark { color: var(--primary-dark-1); background-color: var(--primary-light-1); border-color: var(--primary-light-1); }
.btn-solid-on-dark:hover { background-color: var(--primary-light-3); border-color: var(--primary-light-3); }

.btn-outline-on-dark { color: var(--primary-light-1); background-color: transparent; border-color: var(--primary-light-1); }
.btn-outline-on-dark:hover { color: var(--primary-dark-1); background-color: var(--primary-light-1); }

/* ==========================================================================
   Framework: layout
   ========================================================================== */

.boxed-s { padding-left: max(5%, calc((100% - 47.5rem) / 2)); padding-right: max(5%, calc((100% - 47.5rem) / 2)); }
.boxed-m { padding-left: max(5%, calc((100% - 70rem) / 2)); padding-right: max(5%, calc((100% - 70rem) / 2)); }
.boxed-l { padding-left: max(5%, calc((100% - 77.5rem) / 2)); padding-right: max(5%, calc((100% - 77.5rem) / 2)); }
.boxed-full { padding-left: 5%; padding-right: 5%; }

.rounded-zero { border-radius: var(--size-0); }
.rounded-s { border-radius: var(--radius-s); }
.rounded-m { border-radius: var(--radius-m); }
.rounded-l { border-radius: var(--radius-l); }
.rounded-full { border-radius: var(--radius-pill); }

.shadow-s { box-shadow: 0 2px 8px var(--shadow-tint-s); }
.shadow-m { box-shadow: 0 8px 24px var(--shadow-tint-m); }
.shadow-l { box-shadow: 0 16px 48px var(--shadow-tint-l); }

.divider {
  border-top-width: var(--border-width);
  border-top-style: solid;
  border-top-color: var(--primary-light-3);
  margin-top: var(--size-40);
  margin-bottom: var(--size-40);
}
.hidden { display: none; }

/* ==========================================================================
   Framework: flex and alignment
   ========================================================================== */

.flex-row { display: flex; flex-direction: row; }
.flex-column { display: flex; flex-direction: column; }
.flex-wrap { flex-wrap: wrap; }
.flex-align-start { align-items: flex-start; }
.flex-align-center { align-items: center; }
.flex-align-end { align-items: flex-end; }
.flex-align-stretch { align-items: stretch; }
/* Project extension: icons sit on the text baseline (used by eyebrows) */
.flex-align-baseline { align-items: last baseline; }
.flex-justify-start { justify-content: flex-start; }
.flex-justify-center { justify-content: center; }
.flex-justify-end { justify-content: flex-end; }
.flex-justify-between { justify-content: space-between; }
.text-start { text-align: start; }
.text-center { text-align: center; }
.text-end { text-align: end; }

/* ==========================================================================
   Framework: components
   ========================================================================== */

.card {
  background-color: var(--primary-light-1);
  border-width: var(--border-width);
  border-style: solid;
  border-color: var(--primary-light-3);
  border-radius: var(--radius-m);
}

.badge-1, .badge-2, .badge-3 {
  display: inline-block;
  padding: var(--size-4) var(--size-12);
  font-size: var(--body-size-s);
  font-weight: var(--strong-weight);
  line-height: 160%;
  letter-spacing: 0.03em;
  border-radius: var(--radius-pill);
}
.badge-1 { background-color: var(--primary-transparent-1); color: var(--primary-brand-2); }
/* badge-2: on photos (For sale) */
.badge-2 { background-color: var(--primary-light-1); color: var(--primary-dark-1); }
/* badge-3: on photos (Under contract / Sold) */
.badge-3 { background-color: var(--primary-dark-1); color: var(--primary-light-1); }



/* ===== Globe and popup (taken from the Larkline project CSS) ===== */
.map-stage {
  position: relative;
  height: var(--map-height);
  -webkit-mask-image: radial-gradient(ellipse 72% 70% at 50% 50%, #000000 55%, #00000000 100%);
  mask-image: radial-gradient(ellipse 72% 70% at 50% 50%, #000000 55%, #00000000 100%);
}
.map-canvas { display: block; width: 100%; height: 100%; }
.map-labels { position: absolute; inset: 0; pointer-events: none; }
.map-label {
  position: absolute;
  left: 0;
  top: 0;
  font-family: var(--body-font);
  font-size: var(--body-size-s);
  font-weight: var(--strong-weight);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  white-space: nowrap;
  color: var(--primary-dark-3);
  transition: color var(--duration-m) ease, text-shadow var(--duration-m) ease, opacity var(--duration-m) ease;
}
.map-label.is-lit { color: var(--primary-light-1); text-shadow: 0 1px 4px #211B16CC, 0 0 8px #211B1666; }
.map-label.is-hidden { opacity: 0; }
.map-office {
  position: absolute;
  left: 0;
  top: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--size-4);
  padding: var(--size-12) var(--size-16);
  color: var(--primary-light-1);
  background: var(--primary-dark-1);
  border-width: var(--border-width);
  border-style: solid;
  border-color: var(--primary-brand-1);
  border-radius: var(--radius-s);
  box-shadow: 0 12px 32px var(--shadow-tint-l);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--duration-m) ease;
}
.map-office.is-visible { opacity: 1; }
.map-office-logo { width: var(--map-office-logo); height: auto; }
.map-replay {
  position: absolute;
  right: var(--size-16);
  bottom: var(--size-16);
  padding: var(--size-8) var(--size-16);
  color: var(--primary-light-1);
  background: transparent;
  border-width: var(--border-width);
  border-style: solid;
  border-color: var(--line-on-dark);
  border-radius: var(--radius-pill);
  cursor: pointer;
  opacity: 0;

    Sevenum: 'Marcus', Grubbenvorst: 'Marcus', Melderslo: 'Marcus', Evertsoord: 'Marcus', America: 'Sofia', Griendtsveen: 'Sofia', Kronenberg: 'Sofia' };
  var mapTip = document.createElement('span'); mapTip.className = 'map-tip'; labelsBox.appendChild(mapTip);
  var ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), hot = -1;
  function pick(e) {
    if (!(done || reduced)) return;
    var r = stage.getBoundingClientRect();
    mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(mouse, camera);
    var hit = ray.intersectObject(ball)[0], found = -1;
    if (hit) {
      var p = globe.worldToLocal(hit.point.clone()), len = p.length();
      var hx = Math.atan2(p.x, p.y) * R, hz = Math.asin(p.z / len) * R, bestD = 1.3;
      vp.forEach(function (q, i) { var dd = Math.hypot(q[0] - hx, q[1] - hz) - villages[i][3] * 0.4; if (dd < bestD) { bestD = dd; found = i; } });
    }
    if (found === hot) return;
    if (hot >= 0) { if (MODE !== 'area') tintVillage(hot, false); labels[hot].el.classList.remove('is-hover'); }
    hot = found;
    stage.classList.toggle('is-pointing', hot >= 0);
    if (hot >= 0) {
      if (MODE !== 'area') tintVillage(hot, true); labels[hot].el.classList.add('is-hover');
      mapTip.innerHTML = '<strong>' + villages[hot][0] + '</strong>' + window.lkT('Ask ' + AGENT[villages[hot][0]]);
      mapTip.classList.add('is-visible');
      project(mapTip, labels[hot].pos, '-50%, calc(-100% - 30px)');
    } else mapTip.classList.remove('is-visible');
    if (!running) draw(0);
  }
  stage.addEventListener('pointermove', pick);
  stage.addEventListener('click', pick);
  stage.addEventListener('pointerleave', function () { if (hot >= 0) { if (MODE !== 'area') tintVillage(hot, false); labels[hot].el.classList.remove('is-hover'); hot = -1; mapTip.classList.remove('is-visible'); stage.classList.remove('is-pointing'); if (!running) draw(0); } });
  window.addEventListener('resize', function () { size(); if (reduced || !running) draw(0); });
  return { replay: function () { replay.click(); } };
}
document.querySelectorAll('[data-map]').forEach(function (el) { el.larklineGlobe = larklineGlobe(el, el.getAttribute('data-map') || 'office'); });

/* v14: the location hint in the hero opens a popup with the globe: earth, Europe, then Horst aan de Maas with all villages */
(function () {
  var link = document.querySelector('[data-to-map]');
  var dialog = document.querySelector('.globe-dialog');
  if (!link || !dialog || typeof dialog.showModal !== 'function') return;
  var stage = dialog.querySelector('[data-map]');
  link.addEventListener('click', function (e) {
    e.preventDefault();
    dialog.showModal();
    if (stage.larklineGlobe) { window.dispatchEvent(new Event('resize')); stage.larklineGlobe.replay(); }
  });
  dialog.querySelector('[data-globe-close]').addEventListener('click', function () { dialog.close(); });
  dialog.addEventListener('click', function (e) { if (e.target === dialog) dialog.close(); });
  dialog.addEventListener('close', function () { link.focus(); });
})();
</script>
